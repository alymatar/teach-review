services:
  # بوابة الـ API (باك ايند المايكروسيرفس)
  gateway:
    build: ./backend/gateway
    container_name: techreviews-gateway
    depends_on:
      - auth-service
      - product-service
    environment:
      - PORT=8080
      - AUTH_SERVICE_URL=http://auth-service:4001
      - PRODUCT_SERVICE_URL=http://product-service:4002
      - JWT_ACCESS_SECRET=dev_access_secret
      - JWT_REFRESH_SECRET=dev_refresh_secret
    ports:
      - "8080:8080"

  # خدمة تسجيل الدخول / المستخدمين
  auth-service:
    build: ./backend/auth-service
    container_name: techreviews-auth
    environment:
      - PORT=4001
      # استخدام قاعدة البيانات الخارجية Postgres على جهازك
      - DATABASE_URL=postgres://postgres:0196470893@host.docker.internal:5432/techreviews
      - JWT_ACCESS_SECRET=dev_access_secret
      - JWT_REFRESH_SECRET=dev_refresh_secret
      - BCRYPT_SALT_ROUNDS=10

  # خدمة المنتجات والمراجعات
  product-service:
    build: ./backend/product-service
    container_name: techreviews-product
    environment:
      - PORT=4002
      # نفس قاعدة البيانات الخارجية
      - DATABASE_URL=postgres://postgres:0196470893@host.docker.internal:5432/techreviews
    volumes:
      - ./uploads:/usr/src/app/uploads

  # تطبيق الفرونت + الباك (المونوث) من مجلد frontend
  frontend:
    build: ./frontend
    container_name: techreviews-frontend
    environment:
      - PORT=5000
      - NODE_ENV=production
      # نفس قاعدة البيانات Postgres الخارجية
      - DATABASE_URL=postgres://postgres:0196470893@host.docker.internal:5432/techreviews
      - JWT_ACCESS_SECRET=dev_access_secret
      - JWT_REFRESH_SECRET=dev_refresh_secret
      - BCRYPT_SALT_ROUNDS=10
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads

  # Nginx reverse proxy أمام الفرونت + الجيتواي
  nginx:
    image: nginx:alpine
    container_name: techreviews-nginx
    depends_on:
      - frontend
      - gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

