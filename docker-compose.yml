services:
  gateway:
    build: ./backend/gateway
    container_name: techreviews-gateway
    depends_on:
      - auth-service
      - product-service
    environment:
      - PORT=8080
      - AUTH_SERVICE_URL=http://auth-service:4001
      - PRODUCT_SERVICE_URL=http://product-service:4002
      - JWT_ACCESS_SECRET=dev_access_secret
      - JWT_REFRESH_SECRET=dev_refresh_secret
    ports:
      - "8080:8080"

  auth-service:
    build: ./backend/auth-service
    container_name: techreviews-auth
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      - PORT=4001
      - DATABASE_URL=postgres://postgres:0196470893@auth-db:5432/authdb
      - JWT_ACCESS_SECRET=dev_access_secret
      - JWT_REFRESH_SECRET=dev_refresh_secret
      - BCRYPT_SALT_ROUNDS=10

  product-service:
    build: ./backend/product-service
    container_name: techreviews-product
    depends_on:
      product-db:
        condition: service_healthy
    environment:
      - PORT=4002
      - DATABASE_URL=postgres://postgres:0196470893@product-db:5432/productdb
    volumes:
      - ./uploads:/usr/src/app/uploads

  frontend:
    build: ./frontend
    container_name: techreviews-frontend
    depends_on:
      frontend-db:
        condition: service_healthy
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:0196470893@frontend-db:5432/techreviews
      - JWT_ACCESS_SECRET=dev_access_secret
      - JWT_REFRESH_SECRET=dev_refresh_secret
      - BCRYPT_SALT_ROUNDS=10
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads

  nginx:
    image: nginx:alpine
    container_name: techreviews-nginx
    depends_on:
      - frontend
      - gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  auth-db:
    image: postgres:15-alpine
    container_name: techreviews-auth-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=0196470893
      - POSTGRES_DB=authdb
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  product-db:
    image: postgres:15-alpine
    container_name: techreviews-product-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=0196470893
      - POSTGRES_DB=productdb
    volumes:
      - product_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d productdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend-db:
    image: postgres:15-alpine
    container_name: techreviews-frontend-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=0196470893
      - POSTGRES_DB=techreviews
    volumes:
      - frontend_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d techreviews"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  auth_db_data:
  product_db_data:
  frontend_db_data:

